[plugin]

name="SubViewportDecal"
description="A decal projector that captures a SubViewport and projects it's rendered contents onto 3D surfaces as a Decal. This can be used for things like:
- Real-time 3D model dropshadows
- 2D nodes projected onto 3D geometry
- Live character projections
- World-space UI
- And like, so much more

You can increase the Frame Break variable to lower the capture framerate (maximum framerate is 60 FPS)
Allows in-editor updating"
author="FrogMelon"
version="1.0"
script="plugin.gd"
